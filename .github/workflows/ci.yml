name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth, shared with local dev via nvm. Do not inline
          # a version here: CI must run what the repo declares.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser journey tests
        run: npx playwright install --with-deps chromium
      - name: Tests (node:test)
        run: npm test
      # Both of these derive purely from page content, so a diff here means the
      # committed output is stale. The sitemap is deliberately excluded: its dates
      # come from git history and would differ on the very commit that fixes them.
      - name: Generated files are current
        run: |
          npm run sync:faq
          npm run sync:csp
          git diff --exit-code -- views/index.html server.js \
            || (echo "::error::Run 'npm run sync:faq && npm run sync:csp' and commit the result." && exit 1)
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan (repo + history)
        run: gitleaks detect --redact --exit-code 1
