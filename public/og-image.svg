<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Brand tokens mirrored from /tokens.css. Regenerate the PNG with
       `npm run build:og` after any change here. -->
  <rect width="1200" height="630" fill="#F4EEE5"/>
  <rect x="0" y="0" width="1200" height="14" fill="#D85D43"/>
  <text x="80" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#201B17">Pass<tspan fill="#D85D43">ATS</tspan></text>
  <g transform="translate(1030,168)">
    <circle r="98" fill="none" stroke="#DCD1C5" stroke-width="22"/>
    <circle r="98" fill="none" stroke="#2F6A55" stroke-width="22" stroke-linecap="round" stroke-dasharray="616" stroke-dashoffset="173" transform="rotate(-90)"/>
    <text x="0" y="12" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="#201B17" text-anchor="middle">72</text>
    <text x="0" y="48" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2" fill="#6E655C" text-anchor="middle">ATS SCORE</text>
  </g>
  <text x="82" y="250" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#6E655C">ATS RESUME CHECKER</text>
  <text x="80" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#201B17">Your best work should</text>
  <text x="80" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#201B17">not <tspan font-style="italic" fill="#D85D43">disappear.</tspan></text>
  <text x="82" y="512" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#6E655C">The score, the gaps, and the exact lines to fix.</text>
  <rect x="82" y="546" width="368" height="60" rx="30" fill="#D85D43"/>
